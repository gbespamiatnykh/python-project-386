openapi: 3.1.0
info:
  title: Calendar API
  version: 0.0.0
tags: []
paths:
  /api/health:
    get:
      operationId: getHealth
      description: Check that the backend is up.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Current service status.
      description: Response of the health endpoint.
